<!-- DESKTOP & STICKY GLOBAL HEADER COMPONENT -->
<header class="site-header" id="site-header" role="banner">
  <div class="container header-inner">
    <!-- Society Brand Identity & Liu Kang Calligraphy Title -->
    <a href="{{BASE_PATH}}index.html" class="brand-logo" title="Singapore Nanyang Artists Society (新加坡南洋美术家协会)">
      <img src="{{BASE_PATH}}assets/logo/logo.png" alt="Singapore Nanyang Artists Society Logo" class="brand-logo-img">
    </a>

    <!-- Primary Desktop Navigation (8 Main Items) -->
    <nav class="main-nav" id="desktop-main-nav" aria-label="Primary Navigation">
      <!-- 1. Home -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}index.html" class="nav-link" data-route="home" data-i18n="nav_home">Home</a>
      </div>

      <!-- 2. About -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}about.html" class="nav-link" data-route="about" data-i18n="nav_about">About</a>
      </div>

      <!-- 3. Art Courses -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}courses.html" class="nav-link" data-route="courses" data-i18n="nav_courses">Art Courses</a>
      </div>

      <!-- 4. Grade Examination -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}grade.html" class="nav-link" data-route="grade" data-i18n="nav_grade">Grade Exam</a>
      </div>

      <!-- 5. Nanyang Star -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}nanyang-star.html" class="nav-link" data-route="nanyang-star" data-i18n="nav.nanyang_star">Nanyang Star</a>
      </div>

      <!-- 6. Gallery -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}gallery.html" class="nav-link" data-route="gallery" data-i18n="nav_gallery">Gallery</a>
      </div>

      <!-- 7. News & Events -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}news-events.html" class="nav-link" data-route="news-events" data-i18n="nav_news">News & Events</a>
      </div>

      <!-- 8. Contact -->
      <div class="nav-item">
        <a href="{{BASE_PATH}}contact.html" class="nav-link" data-route="contact" data-i18n="nav_contact">Contact</a>
      </div>
    </nav>

    <!-- Global Header Utility Actions -->
    <div class="header-actions">
      <!-- Universal Search Trigger Button -->
      <button type="button" class="search-trigger-btn" aria-label="Open search dialog (Press Command or Control K)" data-search-trigger>
        <span aria-hidden="true">🔍</span>
        <span class="search-btn-label">Search</span>
        <kbd class="search-kbd-shortcut" aria-hidden="true">⌘K</kbd>
      </button>

      <!-- Compact Multi-language Dropdown Switcher -->
      <div class="lang-dropdown-wrapper" id="lang-dropdown-wrapper">
        <button type="button" class="lang-dropdown-btn" id="lang-dropdown-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Select Language">
          <span class="lang-globe-icon" aria-hidden="true">🌐</span>
          <span class="lang-current-code" id="lang-current-code">EN</span>
          <span class="lang-dropdown-caret" aria-hidden="true">▾</span>
        </button>
        <div class="lang-dropdown-menu" id="lang-dropdown-menu" role="menu" aria-labelledby="lang-dropdown-toggle">
          <button type="button" class="lang-dropdown-item active" data-lang="en" role="menuitem" aria-current="true">
            <span class="lang-item-flag">🇬🇧</span>
            <span class="lang-item-name">English</span>
            <span class="lang-item-code">EN</span>
          </button>
          <button type="button" class="lang-dropdown-item" data-lang="zh-SG" role="menuitem" aria-current="false">
            <span class="lang-item-flag">🇸🇬</span>
            <span class="lang-item-name">中文 (新加坡)</span>
            <span class="lang-item-code">ZH</span>
          </button>
        </div>
      </div>

      <!-- Dual Call-to-Action Buttons -->
      <div class="header-cta-group">
        <a href="{{BASE_PATH}}contact.html?type=enquiry" class="btn btn-outline btn-sm header-enquire-btn" data-i18n="cta_enquire">Enquire</a>
        <a href="{{BASE_PATH}}contact.html?type=registration" class="btn btn-primary btn-sm header-register-btn" data-i18n="cta_register">Register</a>
      </div>

      <!-- Mobile Hamburger Button -->
      <button type="button" class="mobile-hamburger-btn" id="mobile-hamburger-btn" aria-label="Open mobile navigation menu" aria-expanded="false" aria-controls="mobile-nav-drawer">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </div>
</header>
