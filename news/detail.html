<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Dispatch | Nanyang Artists Society</title>
  <meta name="description" content="Official editorial dispatch from the Singapore Nanyang Artists Society.">
  <link rel="icon" type="image/png" href="../assets/logo/logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Shared Roots -->
  <div id="announcement-root"></div>
  <div id="header-root"></div>

  <main class="site-main">
    <!-- Breadcrumb Navigation -->
    <div style="background: var(--color-warm-ivory-dark); border-bottom: 1px solid var(--color-paper-border);">
      <div class="container breadcrumb-nav">
        <ol class="breadcrumb-list">
          <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
          <li class="breadcrumb-separator">/</li>
          <li class="breadcrumb-item"><a href="index.html">News & Editorial</a></li>
          <li class="breadcrumb-separator">/</li>
          <li class="breadcrumb-item" aria-current="page" style="color: var(--color-ink-black); font-weight: 600;">Article Reader</li>
        </ol>
      </div>
    </div>

    <!-- Article Content Section -->
    <section class="section">
      <div class="container" style="max-width: 860px;">
        <article class="card" style="padding: 40px 36px; margin-bottom: 40px;">
          <!-- Article Header Meta -->
          <div style="margin-bottom: 24px;">
            <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;">
              <span class="seal-badge seal-badge-cobalt" id="article-category-badge">News</span>
              <span style="font-size: 12px; color: var(--color-ink-muted);" id="article-meta-date">Date</span>
              <span style="font-size: 12px; color: var(--color-ink-muted);" id="article-meta-author">Author</span>
            </div>

            <h1 style="font-size: 30px; line-height: 1.3; margin: 0 0 6px; color: var(--color-ink-black);" id="article-title-en">
              Loading article...
            </h1>
            <h2 style="font-size: 16px; color: var(--color-cinnabar); font-weight: 600; margin: 0;" id="article-title-zh">
              请稍候...
            </h2>
          </div>

          <!-- Hero Image -->
          <div style="margin-bottom: 32px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card);">
            <img src="" alt="" id="article-hero-image" style="width: 100%; height: 380px; object-fit: cover;" onerror="this.onerror=null; this.src='../assets/logo/logo.png';">
          </div>

          <!-- Body Content Container -->
          <div id="article-body-content" style="border-bottom: 1px solid var(--color-paper-border); padding-bottom: 24px; margin-bottom: 24px;"></div>

          <!-- Tags & Social Share -->
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; gap: 6px; flex-wrap: wrap;" id="article-tags-container"></div>

            <div style="display: flex; gap: 8px; align-items: center;">
              <span style="font-size: 12px; color: var(--color-ink-muted);">Share:</span>
              <button type="button" class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(window.location.href); alert('Article URL copied to clipboard!');">
                📋 Copy Link
              </button>
              <a href="../competitions/register.html" class="btn btn-primary btn-sm">
                ⭐ Enter 2026 Competition →
              </a>
            </div>
          </div>
        </article>

        <!-- Related News Section -->
        <div>
          <div style="margin-bottom: 18px; border-bottom: 2px solid var(--color-paper-border); padding-bottom: 8px;">
            <span class="seal-badge seal-badge-gold" style="margin-bottom: 4px;">More Stories</span>
            <h3 style="font-size: 20px; margin: 0;">Related Dispatches & Announcements</h3>
          </div>
          <div class="grid grid-cols-3" id="related-articles-container" style="gap: 20px;"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Footer Root -->
  <div id="footer-root"></div>

  <!-- Shared Bootloader & Article Resolver -->
  <script type="module" src="../js/core/app.js"></script>
  <script type="module" src="../js/news-detail.js"></script>
</body>
</html>
